<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연쌤의 웹 앱 공작소 ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');

        body {
            background-color: #fff9f0;
            font-family: 'Gaegu', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff85a2;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px #fff;
        }

        .app-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 900px;
            width: 100%;
        }

        .app-card {
            background: white;
            border: 3px solid #ffc2d1;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            box-shadow: 0 8px 0 #ffc2d1;
        }

        /* 수족관 카드 (하늘색) */
        .aqua-card { border-color: #a2d2ff; box-shadow: 0 8px 0 #a2d2ff; }
        .aqua-card:hover { background-color: #f0f8ff; }
        .aqua-card:active { box-shadow: 0 2px 0 #a2d2ff; }

        /* 과수원 카드 (초록색) */
        .orchard-card { border-color: #a8e063; box-shadow: 0 8px 0 #a8e063; }
        .orchard-card:hover { background-color: #f7fff0; }
        .orchard-card:active { box-shadow: 0 2px 0 #a8e063; }

        .app-card:hover { transform: translateY(-10px); }
        .app-card:active { transform: translateY(5px); }

        .app-icon { font-size: 55px; margin-bottom: 10px; }
        .app-title { font-size: 1.6rem; font-weight: bold; margin-bottom: 5px; }
        p { margin: 5px 0; font-size: 1.1rem; color: #666; }
    </style>
</head>
<body>

    <h1>✨ 자연쌤의 웹 앱 공작소 ✨</h1>

    <div class="app-container">
        <a href="PHOTOBOOTH.html" class="app-card">
            <div class="app-icon">📸</div>
            <div class="app-title">인생네컷 포토부스</div>
            <p>찰칵! 예쁜 추억을 남겨요</p>
        </a>

        <a href="AQUARIUM.html" class="app-card aqua-card">
            <div class="app-icon">🐠</div>
            <div class="app-title">수족관 놀이터</div>
            <p>물고기들과 함께 놀아요!</p>
        </a>

        <a href="ORCHARD.html" class="app-card orchard-card">
            <div class="app-icon">🍎</div>
            <div class="app-title">햇살 과수원</div>
            <p>나뭇가지에 열매가 대롱대롱!</p>
        </a>
    </div>

</body>
</html>
