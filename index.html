<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자연쌤의 웹 앱 공작소 ✨</title>
    <style>
        /* 아기자기한 폰트와 배경 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');

        body {
            background-color: #fff9f0; /* 연한 크림색 배경 */
            font-family: 'Gaegu', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ff85a2; /* 핑크색 제목 */
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px #fff;
        }

        /* 웹 앱 목록 컨테이너 */
        .app-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
        }

        /* 개별 앱 카드 스타일 */
        .app-card {
            background: white;
            border: 3px solid #ffc2d1;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            cursor: pointer;
            text-decoration: none; /* 밑줄 제거 */
            color: #333;
            box-shadow: 0 8px 0 #ffc2d1; /* 입체감 있는 그림자 */
        }

        .app-card:hover {
            transform: translateY(-10px);
            background-color: #fff0f3;
        }

        .app-card:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #ffc2d1;
        }

        .app-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>✨ 자연쌤의 웹 앱 공작소 ✨</h1>

    <div class="app-container">
        <a href="PHOTOBOOTH.html" class="app-card">
            <div class="app-icon">📸</div>
            <div class="app-title">인생네컷 포토부스</div>
            <p>찰칵! 예쁜 추억을 남겨요</p>
        </a>

        <div class="app-card" style="opacity: 0.6; cursor: default;">
            <div class="app-icon">🛠️</div>
            <div class="app-title">준비 중...</div>
            <p>다음 앱을 기대해 주세요!</p>
        </div>
    </div>

</body>
</html>
