<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 네컷 스튜디오 Pro</title>
    <style>
        :root { --accent: #6366f1; }
        body { margin: 0; font-family: 'Pretendard', sans-serif; background: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .app-container { display: flex; width: 95vw; height: 90vh; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        
        .editor-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #f8fafc; position: relative; }
        .canvas-wrapper { position: relative; width: 400px; height: 600px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        #cameraView { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #mainCanvas { position: absolute; width: 100%; height: 100%; z-index: 2; cursor: crosshair; }
        
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; color: white; font-weight: bold; text-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 10; display: none; }

        .control-panel { width: 380px; padding: 25px; border-left: 1px solid #eee; overflow-y: auto; }
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 20px; }
        .theme-btn { padding: 10px; border: 2px solid #eee; background: white; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .theme-btn.active { border-color: var(--accent); background: #f5f3ff; color: var(--accent); }

        .tool-box { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; margin-top: 10px; }
        .btn-danger { background: #ef4444; color: white; margin-top: 5px; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; font-size: 26px; text-align: center; }
        .sticker-item { cursor: pointer; transition: transform 0.2; }
        .sticker-item:hover { transform: scale(1.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <section class="editor-view">
            <div id="countdown">3</div>
            <div class="canvas-wrapper" id="frameView">
                <video id="cameraView" autoplay playsinline muted></video>
                <canvas id="mainCanvas"></canvas>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px; width: 400px;">
                <button id="captureBtn" class="btn-primary" onclick="startFourCut()">📸 네컷 촬영 시작 (3초 간격)</button>
                <div id="editActions" class="hidden" style="display:flex; gap:10px; width:100%;">
                    <button onclick="resetStudio()" style="background:#64748b; color:white;">🔄 다시 찍기</button>
                    <button class="btn-primary" style="background:#22c55e" onclick="downloadImage()">💾 저장</button>
                </div>
            </div>
        </section>

        <aside class="control-panel">
            <h3>🖼️ 배경 테마</h3>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="changeTheme('white', this)">깔끔 화이트</button>
                <button class="theme-btn" onclick="changeTheme('#ffb7c5', this)">벚꽃 핑크</button>
                <button class="theme-btn" onclick="changeTheme('#a5d8ff', this)">하늘 블루</button>
                <button class="theme-btn" onclick="changeTheme('#2d3436', this)">시크 블랙</button>
            </div>

            <div class="tool-box">
                <h3>✍️ 문구 & 스티커 관리</h3>
                <input type="text" id="textInput" placeholder="문구 입력">
                <button class="btn-primary" onclick="addTextObject()">문구 추가</button>
                <div id="selectedControls" class="hidden">
                    <p style="font-size:12px; color:red; margin:10px 0 0 0;">* 선택된 항목 삭제: Delete키 또는 버튼</p>
                    <button class="btn-danger" onclick="deleteSelected()">🗑️ 선택 항목 삭제</button>
                </div>
            </div>

            <h3>⭐ 스티커 추가</h3>
            <div class="sticker-grid">
                <span class="sticker-item" onclick="addSticker('❤️')">❤️</span>
                <span class="sticker-item" onclick="addSticker('💖')">💖</span>
                <span class="sticker-item" onclick="addSticker('✨')">✨</span>
                <span class="sticker-item" onclick="addSticker('🎀')">🎀</span>
                <span class="sticker-item" onclick="addSticker('🍀')">🍀</span>
                <span class="sticker-item" onclick="addSticker('🐱')">🐱</span>
                <span class="sticker-item" onclick="addSticker('🐻')">🐻</span>
                <span class="sticker-item" onclick="addSticker('🐥')">🐥</span>
            </div>
        </aside>
    </div>

    <script>
        const video = document.getElementById('cameraView');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdown');
        
        let objects = [], selectedObj = null, isDragging = false;
        let photos = [], currentBgColor = 'white';
        
        canvas.width = 400; canvas.height = 600;

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
        }

        function changeTheme(color, btn) {
            currentBgColor = color;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // 네컷 촬영 로직
        async function startFourCut() {
            photos = [];
            document.getElementById('captureBtn').classList.add('hidden');
            
            for (let i = 0; i < 4; i++) {
                await countdown(3);
                capturePart();
            }
            
            video.classList.add('hidden');
            document.getElementById('editActions').classList.remove('hidden');
        }

        function countdown(sec) {
            return new Promise(resolve => {
                countdownEl.style.display = 'block';
                let count = sec;
                countdownEl.innerText = count;
                
                const timer = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        countdownEl.style.display = 'none';
                        resolve();
                    }
                    countdownEl.innerText = count;
                }, 1000);
            });
        }

        function capturePart() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 360; tempCanvas.height = 130;
            const tCtx = tempCanvas.getContext('2d');
            // 가로 비디오를 네컷 규격에 맞춰 자름
            tCtx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, 0, 0, 360, 130);
            photos.push(tempCanvas);
        }

        function render() {
            ctx.fillStyle = currentBgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 찍힌 사진 4장 배치
            photos.forEach((img, i) => {
                ctx.drawImage(img, 20, 20 + (i * 140), 360, 130);
            });

            // 오브젝트(글자, 스티커) 그리기
            objects.forEach(obj => {
                ctx.save();
                ctx.textAlign = "center";
                ctx.font = `${obj.size}px Arial`;
                if(selectedObj === obj) {
                    ctx.strokeStyle = "#6366f1"; ctx.lineWidth = 2;
                    ctx.strokeRect(obj.x - obj.size/2, obj.y - obj.size/2, obj.size, obj.size);
                }
                ctx.fillText(obj.content, obj.x, obj.y + obj.size/3);
                ctx.restore();
            });
            requestAnimationFrame(render);
        }

        function addTextObject() {
            const val = document.getElementById('textInput').value;
            if(val) objects.push({type:'text', content:val, x:200, y:580, size:30});
        }

        function addSticker(s) {
            objects.push({type:'sticker', content:s, x:200, y:300, size:60});
        }

        function deleteSelected() {
            if(selectedObj) {
                objects = objects.filter(o => o !== selectedObj);
                selectedObj = null;
                document.getElementById('selectedControls').classList.add('hidden');
            }
        }

        // 드래그 및 선택 로직
        canvas.onmousedown = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            selectedObj = objects.findLast(o => Math.abs(o.x - x) < 30 && Math.abs(o.y - y) < 30);
            if(selectedObj) {
                isDragging = true;
                document.getElementById('selectedControls').classList.remove('hidden');
            } else {
                document.getElementById('selectedControls').classList.add('hidden');
            }
        };

        window.onmousemove = (e) => {
            if(isDragging && selectedObj) {
                const rect = canvas.getBoundingClientRect();
                selectedObj.x = (e.clientX - rect.left) * (canvas.width / rect.width);
                selectedObj.y = (e.clientY - rect.top) * (canvas.height / rect.height);
            }
        };

        window.onmouseup = () => isDragging = false;
        
        window.onkeydown = (e) => {
            if(e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
        };

        function resetStudio() {
            photos = []; objects = [];
            video.classList.remove('hidden');
            document.getElementById('captureBtn').classList.remove('hidden');
            document.getElementById('editActions').classList.add('hidden');
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'four-cut.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        startCamera(); render();
    </script>
</body>
</html>
