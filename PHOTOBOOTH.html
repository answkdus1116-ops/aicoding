<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎨 인생네컷 스튜디오 Pro - 버그 수정판</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');

        :root { --accent: #6366f1; }
        body { 
            margin: 0; 
            font-family: 'Gaegu', 'Pretendard', sans-serif; 
            background: #f1f5f9; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        /* 아이패드 등 태블릿 화면에서도 스크롤 가능하도록 반응형 수정 */
        .app-container { 
            display: flex; 
            width: 95vw; 
            height: 90vh; 
            background: white; 
            border-radius: 30px; 
            overflow: hidden; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1); 
        }
        
        @media (max-width: 820px) {
            .app-container {
                flex-direction: column;
                height: 95vh;
                overflow-y: auto;
            }
            .control-panel {
                width: auto !important;
                border-left: none !important;
                border-top: 1px solid #eee;
            }
        }

        .editor-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background: #f8fafc; position: relative; }
        
        /* 비율 기반으로 캔버스가 자동으로 화면에 맞게 조절됨 */
        .canvas-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 400px; 
            aspect-ratio: 400 / 680; 
            background: #fff; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            transition: 0.3s; 
        }
        
        /* 비디오 요소는 화면에 띄우지 않고, 데이터만 읽어서 캔버스에 직접 그림 */
        #cameraView { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
            pointer-events: none; 
        }
        
        /* 터치 시 브라우저 기본 스크롤/확대 방지 */
        #mainCanvas { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
            cursor: crosshair; 
            touch-action: none; 
        }
        
        #countdown { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; color: var(--accent); font-weight: bold; z-index: 10; display: none; text-shadow: 2px 2px 10px white; }

        .control-panel { width: 380px; padding: 25px; border-left: 1px solid #eee; overflow-y: auto; }
        
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 20px; }
        .theme-btn { padding: 10px; border: 2px solid #eee; background: white; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: bold; }
        .theme-btn.active { border-color: var(--accent); background: #f5f3ff; color: var(--accent); }

        .tool-box { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .tool-box h3 { margin-top: 0; font-size: 18px; color: #1e293b; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        button { padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-family: inherit; font-size: 16px; }
        
        .btn-primary { background: var(--accent); color: white; margin-top: 10px; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-danger { background: #ef4444; color: white; margin-top: 5px; }
        .btn-danger:hover { background: #dc2626; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; font-size: 26px; text-align: center; margin-bottom: 15px; }
        .sticker-item { cursor: pointer; transition: transform 0.2s; padding: 5px; border-radius: 5px; }
        .sticker-item:hover { transform: scale(1.3); background: #e2e8f0; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <section class="editor-view">
            <div id="countdown">3</div>
            <div class="canvas-wrapper" id="photo-frame">
                <video id="cameraView" autoplay playsinline muted></video>
                <canvas id="mainCanvas"></canvas>
            </div>
            
            <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px; width: 100%; max-width: 400px;">
                <div id="captureControls">
                    <button id="captureBtn" class="btn-primary" onclick="handleCapture()">📸 <span id="cutText">첫 번째 컷</span> 촬영 (3초)</button>
                </div>
                <div id="confirmControls" class="hidden" style="display:flex; gap:10px;">
                    <button onclick="retake()" style="background:#64748b; color:white;">❌ 다시 찍기</button>
                    <button onclick="nextCut()" style="background:#22c55e; color:white;">✅ 다음으로</button>
                </div>
                <div id="editActions" class="hidden" style="display:flex; gap:10px;">
                    <button onclick="resetStudio()" style="background:#64748b; color:white;">🔄 전체 초기화</button>
                    <button class="btn-primary" style="background:#22c55e" onclick="downloadImage()">💾 최종 저장</button>
                </div>
            </div>
        </section>

        <aside class="control-panel">
            <h3>🖼️ 배경 테마</h3>
            <div class="theme-grid">
                <button class="theme-btn active" onclick="changeTheme('none', this)">🤍 화이트</button>
                <button class="theme-btn" onclick="changeTheme('spring', this)">🌸 봄 핑크</button>
                <button class="theme-btn" onclick="changeTheme('summer', this)">🌻 여름 블루</button>
                <button class="theme-btn" onclick="changeTheme('autumn', this)">🍂 가을 오렌지</button>
                <button class="theme-btn" onclick="changeTheme('winter', this)">☃️ 겨울 그레이</button>
                <button class="theme-btn" onclick="changeTheme('grad', this)">🎓 졸업 축하</button>
                <button class="theme-btn" onclick="changeTheme('love', this)">❤️ 사랑 핑크</button>
            </div>

            <div class="tool-box">
                <h3>✍️ 문구 추가</h3>
                <input type="text" id="textInput" placeholder="여기에 문구를 입력하세요">
                <select id="fontFamily">
                    <option value="Gaegu">귀여운 개구체</option>
                    <option value="Arial">깔끔한 고딕체</option>
                    <option value="serif">진지한 명조체</option>
                </select>
                <button class="btn-primary" onclick="addTextObject()">문구 넣기</button>
            </div>

            <h3>⭐ 스티커 (클릭해서 추가)</h3>
            <div class="sticker-grid">
                <span class="sticker-item" onclick="addSticker('❤️')">❤️</span>
                <span class="sticker-item" onclick="addSticker('✨')">✨</span>
                <span class="sticker-item" onclick="addSticker('🍀')">🍀</span>
                <span class="sticker-item" onclick="addSticker('🐱')">🐱</span>
                <span class="sticker-item" onclick="addSticker('🐥')">🐥</span>
                <span class="sticker-item" onclick="addSticker('🎀')">🎀</span>
                <span class="sticker-item" onclick="addSticker('🌸')">🌸</span>
                <span class="sticker-item" onclick="addSticker('🔥')">🔥</span>
                <span class="sticker-item" onclick="addSticker('🎓')">🎓</span>
                <span class="sticker-item" onclick="addSticker('🧸')">🧸</span>
            </div>

            <div id="selectedControls" class="tool-box hidden">
                <h3 style="color: #6366f1;">🛠️ 선택 항목 조절</h3>
                <p style="font-size: 14px; margin: 0 0 5px 0;">📏 크기 조절</p>
                <input type="range" id="sizeSlider" min="20" max="200" value="50" oninput="updateSize(this.value)">
                <button class="btn-danger" onclick="deleteSelected()">🗑️ 삭제하기 (Delete 키)</button>
            </div>
        </aside>
    </div>

    <script>
        const video = document.getElementById('cameraView');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const countdownEl = document.getElementById('countdown');
        
        let objects = [], selectedObj = null, isDragging = false;
        let photos = [], currentCut = 0, currentTheme = 'none';
        
        // 캔버스 자체 내부 해상도 (비율 유지를 위해 고정)
        canvas.width = 400; 
        canvas.height = 680;

        // 사진 규격
        const targetW = 340;
        const targetH = 130;

        // 카메라 시작
        async function startCamera() {
            try {
                // 모바일 최적화를 위해 width/height 제약조건 완화
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
            } catch(e) {
                alert("카메라 권한을 허용해주세요!");
            }
        }

        // 테마 설정
        function changeTheme(theme, btn) {
            currentTheme = theme;
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function drawFrame() {
            const themes = {
                none: { color: '#ffffff', icons: [] },
                spring: { color: '#fff0f5', icons: ['🌸', '🌷'] },
                summer: { color: '#e0f7fa', icons: ['🌻', '🌊'] },
                autumn: { color: '#fff3e0', icons: ['🍂', '🍁'] },
                winter: { color: '#f1f5f9', icons: ['☃️', '❄️'] },
                grad: { color: '#f8fafc', icons: ['🎓', '💐'] },
                love: { color: '#fff1f2', icons: ['❤️', '💖'] }
            };

            const config = themes[currentTheme];
            
            ctx.fillStyle = config.color;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if(currentTheme !== 'none' && config.icons.length > 0) {
                ctx.font = "24px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const step = 60;
                
                for(let x = 20; x <= 380; x += step) {
                    ctx.fillText(config.icons[x % config.icons.length], x, 25);
                    ctx.fillText(config.icons[(x+1) % config.icons.length], x, canvas.height - 25);
                }
                for(let y = 70; y <= canvas.height - 70; y += step) {
                    ctx.fillText(config.icons[y % config.icons.length], 20, y);
                    ctx.fillText(config.icons[(y+1) % config.icons.length], 380, y);
                }
            }
        }

        async function handleCapture() {
            document.getElementById('captureControls').classList.add('hidden');
            await startCountdown(3);
            takeShot();
        }

        function startCountdown(sec) {
            return new Promise(resolve => {
                countdownEl.style.display = 'block';
                let count = sec;
                countdownEl.innerText = count;
                const timer = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(timer);
                        countdownEl.style.display = 'none';
                        resolve();
                    }
                    countdownEl.innerText = count;
                }, 1000);
            });
        }

        // 공통 크롭 로직 (비디오 가로, 세로 비율에 맞춰 중앙을 잘라냄)
        function getCropCoordinates() {
            const sourceW = video.videoWidth;
            const sourceH = video.videoHeight;
            const targetRatio = targetW / targetH;
            const sourceRatio = sourceW / sourceH;

            let srcX, srcY, srcW, srcH;

            if (sourceRatio > targetRatio) {
                srcH = sourceH;
                srcW = srcH * targetRatio;
                srcX = (sourceW - srcW) / 2;
                srcY = 0;
            } else {
                srcW = sourceW;
                srcH = srcW / targetRatio;
                srcX = 0;
                srcY = (sourceH - srcH) / 2;
            }
            return { srcX, srcY, srcW, srcH };
        }

        function takeShot() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = targetW; 
            tempCanvas.height = targetH;
            const tCtx = tempCanvas.getContext('2d');
            
            if (video.videoWidth > 0) {
                const { srcX, srcY, srcW, srcH } = getCropCoordinates();
                
                // 좌우 반전해서 저장 (거울 모드)
                tCtx.translate(targetW, 0);
                tCtx.scale(-1, 1);
                tCtx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, targetW, targetH);
            } else {
                tCtx.fillStyle = '#ccc';
                tCtx.fillRect(0, 0, targetW, targetH);
            }
            
            photos[currentCut] = tempCanvas;
            document.getElementById('confirmControls').classList.remove('hidden');
        }

        function nextCut() {
            currentCut++;
            document.getElementById('confirmControls').classList.add('hidden');
            if (currentCut < 4) {
                document.getElementById('cutText').innerText = ["첫 번째", "두 번째", "세 번째", "네 번째"][currentCut] + " 컷";
                document.getElementById('captureControls').classList.remove('hidden');
            } else {
                currentCut = 4;
                document.getElementById('editActions').classList.remove('hidden');
            }
        }

        function retake() {
            // [수정된 부분] 다시 찍기 클릭 시 현재 사진 정보를 초기화합니다.
            photos[currentCut] = null; 
            
            document.getElementById('confirmControls').classList.add('hidden');
            document.getElementById('captureControls').classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawFrame(); // 배경 및 테두리 그리기

            const basePhotoY = 50; 
            const photoStep = 140;

            // 1. 찍힌 사진들 렌더링 (값이 존재할 때만 그리기)
            photos.forEach((img, i) => {
                if(img) ctx.drawImage(img, 30, basePhotoY + (i * photoStep), targetW, targetH);
            });

            // 2. 실시간 카메라 미리보기 렌더링 
            // [수정된 부분] 현재 컷(photos[currentCut])에 아직 사진이 없을 때만 카메라를 켭니다!
            if (currentCut < 4 && !photos[currentCut] && video.readyState >= 2) {
                const previewY = basePhotoY + (currentCut * photoStep);
                const { srcX, srcY, srcW, srcH } = getCropCoordinates();

                ctx.save();
                // 미리보기 좌우 반전 거울 효과
                ctx.translate(30 + targetW, previewY);
                ctx.scale(-1, 1);
                ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, targetW, targetH);
                ctx.restore();

                // 촬영 포커스 테두리
                ctx.strokeStyle = "#6366f1";
                ctx.lineWidth = 3;
                ctx.strokeRect(30, previewY, targetW, targetH);
            }

            // 3. 문구 및 스티커 렌더링
            objects.forEach(obj => {
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${obj.size}px ${obj.font || 'Arial'}`;
                ctx.fillStyle = '#000'; 

                if(selectedObj === obj) {
                    ctx.strokeStyle = "#6366f1"; ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(obj.x - obj.size/1.5, obj.y - obj.size/1.5, obj.size*1.3, obj.size*1.3);
                }
                ctx.fillText(obj.content, obj.x, obj.y);
                ctx.restore();
            });

            requestAnimationFrame(render);
        }

        function addTextObject() {
            const val = document.getElementById('textInput').value;
            const font = document.getElementById('fontFamily').value;
            if(val) {
                objects.push({type:'text', content:val, x:200, y:canvas.height - 60, size:40, font: font});
                document.getElementById('textInput').value = '';
                document.getElementById('editActions').classList.remove('hidden');
            }
        }

        function addSticker(s) {
            objects.push({type:'sticker', content:s, x:200, y:300, size:50, font:'Arial'});
            document.getElementById('editActions').classList.remove('hidden');
        }

        function updateSize(v) {
            if(selectedObj) selectedObj.size = parseInt(v);
        }

        function deleteSelected() {
            if(selectedObj) {
                objects = objects.filter(o => o !== selectedObj);
                selectedObj = null;
                document.getElementById('selectedControls').classList.add('hidden');
            }
        }

        // ==========================================
        // [버그 수정] 터치 및 마우스 이벤트 통합 지원 (아이패드/모바일 완벽 호환)
        // ==========================================
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            // 터치 이벤트인 경우
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handlePointerDown(e) {
            const pos = getEventPos(e);
            selectedObj = null;
            
            for(let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                if(Math.abs(o.x - pos.x) < o.size/1.2 && Math.abs(o.y - pos.y) < o.size/1.2) {
                    selectedObj = o;
                    objects.push(objects.splice(i, 1)[0]); 
                    break;
                }
            }
            
            if(selectedObj) {
                isDragging = true;
                document.getElementById('selectedControls').classList.remove('hidden');
                document.getElementById('sizeSlider').value = selectedObj.size;
                if(e.cancelable) e.preventDefault(); // 아이패드 스크롤 간섭 방지
            } else {
                document.getElementById('selectedControls').classList.add('hidden');
            }
        }

        function handlePointerMove(e) {
            if(isDragging && selectedObj) {
                if(e.cancelable) e.preventDefault(); // 드래그 시 화면 스크롤 방지
                const pos = getEventPos(e);
                selectedObj.x = pos.x;
                selectedObj.y = pos.y;
            }
        }

        function handlePointerUp() { 
            isDragging = false; 
        }

        // 마우스 및 터치 이벤트 리스너 등록
        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        
        window.addEventListener('mouseup', handlePointerUp);
        window.addEventListener('touchend', handlePointerUp);
        window.addEventListener('keydown', (e) => { if(e.key === 'Delete' || e.key === 'Backspace') deleteSelected(); });

        function resetStudio() {
            photos = []; objects = []; currentCut = 0;
            document.getElementById('editActions').classList.add('hidden');
            document.getElementById('captureControls').classList.remove('hidden');
            document.getElementById('cutText').innerText = "첫 번째 컷";
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'my-four-cut.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        startCamera(); 
        render();
    </script>
</body>
</html>
